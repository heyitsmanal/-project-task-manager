server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ptm}
    username: ${DB_USER:ptm_user}
    password: ${DB_PASSWORD:ptm_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expirationMillis: ${JWT_EXPIRATION_MILLIS:86400000}
